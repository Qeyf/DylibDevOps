name: Build Premium Gate Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'bypassed/PremiumGateProbe.m'
      - 'original/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Verify original fingerprint when binary is present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f original/PinterestPatch.dylib ]; then
            EXPECTED="bd86770c05e8a290d9b729f8922c3f3f8fde737e8463c79d4bf4dbc4d86ce017"
            ACTUAL="$(shasum -a 256 original/PinterestPatch.dylib | awk '{print $1}')"
            echo "expected=$EXPECTED"
            echo "actual=$ACTUAL"
            test "$ACTUAL" = "$EXPECTED"
          else
            echo "original/PinterestPatch.dylib is not committed; fingerprint metadata remains available in original/."
          fi

      - name: Build iPhoneOS diagnostic dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/arm64 build/arm64e build/final

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          SOURCE="bypassed/PremiumGateProbe.m"

          COMMON=(
            -isysroot "$SDK"
            -fobjc-arc
            -fvisibility=hidden
            -dynamiclib
            -framework Foundation
            -Wl,-dead_strip
            -Wl,-install_name,@rpath/PremiumGateProbe.dylib
          )

          "$CLANG" \
            -target arm64-apple-ios13.0 \
            "${COMMON[@]}" \
            "$SOURCE" \
            -o build/arm64/PremiumGateProbe.dylib

          FINAL="build/final/PremiumGateProbe.dylib"
          if "$CLANG" \
            -target arm64e-apple-ios13.0 \
            "${COMMON[@]}" \
            "$SOURCE" \
            -o build/arm64e/PremiumGateProbe.dylib; then
            xcrun lipo -create \
              build/arm64/PremiumGateProbe.dylib \
              build/arm64e/PremiumGateProbe.dylib \
              -output "$FINAL"
          else
            echo "arm64e slice unavailable in this toolchain; publishing arm64, which is the required third-party iOS app ABI."
            cp build/arm64/PremiumGateProbe.dylib "$FINAL"
          fi

          codesign --force --sign - --timestamp=none "$FINAL"

      - name: Validate dylib
        shell: bash
        run: |
          set -euo pipefail
          DYLIB="build/final/PremiumGateProbe.dylib"
          {
            echo "=== file ==="
            file "$DYLIB"
            echo
            echo "=== architectures ==="
            xcrun lipo -info "$DYLIB" || true
            echo
            echo "=== linked libraries ==="
            otool -L "$DYLIB"
            echo
            echo "=== code signature ==="
            codesign -dv --verbose=4 "$DYLIB" 2>&1 || true
            echo
            echo "=== sha256 ==="
            shasum -a 256 "$DYLIB"
          } | tee build/final/build-manifest.txt

      - name: Upload device-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: PremiumGateProbe-iPhoneOS-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/final/PremiumGateProbe.dylib
            build/final/build-manifest.txt
