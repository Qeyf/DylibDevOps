name: Verify dylib hypothesis

on:
  workflow_dispatch:
  push:
    paths:
      - 'original/**'
      - 'verification/**'
      - 'bypassed/**'
      - 'analysis/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'original/**'
      - 'verification/**'
      - 'bypassed/**'
      - 'analysis/**'
      - '.github/workflows/verify.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify supplied original binary
        run: |
          python3 analysis/verify_original.py original/PinterestPatch.dylib | tee original-verification.txt

      - name: Build diagnostic and bypass iOS arm64 dylibs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build bypassed
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"

          COMMON_FLAGS=(
            -target arm64-apple-ios13.0
            -isysroot "$SDK"
            -fobjc-arc
            -fvisibility=hidden
            -dynamiclib
            -framework Foundation
          )

          "$CLANG" "${COMMON_FLAGS[@]}" \
            -Wl,-install_name,@rpath/PremiumGateProbe.dylib \
            verification/PremiumGateProbe.m \
            -o build/PremiumGateProbe.dylib

          "$CLANG" "${COMMON_FLAGS[@]}" \
            -Wl,-install_name,@rpath/PremiumBypass.dylib \
            bypassed/PremiumBypass.m \
            -o bypassed/PremiumBypass.dylib

          codesign --force --sign - build/PremiumGateProbe.dylib
          codesign --force --sign - bypassed/PremiumBypass.dylib

          file build/PremiumGateProbe.dylib
          file bypassed/PremiumBypass.dylib
          shasum -a 256 build/PremiumGateProbe.dylib bypassed/PremiumBypass.dylib | tee build/SHA256SUMS

      - name: Record binary metadata
        run: |
          xcrun llvm-objdump --macho --private-headers build/PremiumGateProbe.dylib > build/probe-macho-headers.txt
          xcrun llvm-objdump --macho --private-headers bypassed/PremiumBypass.dylib > build/bypass-macho-headers.txt
          nm -gU build/PremiumGateProbe.dylib > build/probe-exported-symbols.txt || true
          nm -gU bypassed/PremiumBypass.dylib > build/bypass-exported-symbols.txt || true

          if [ -f original/PinterestPatch.dylib ]; then
            file original/PinterestPatch.dylib > build/original-file.txt
            shasum -a 256 original/PinterestPatch.dylib > build/original-sha256.txt
            xcrun llvm-objdump --macho --private-headers original/PinterestPatch.dylib > build/original-macho-headers.txt
          fi

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-verification-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/PremiumGateProbe.dylib
            bypassed/PremiumBypass.dylib
            build/SHA256SUMS
            build/*.txt
            original-verification.txt
